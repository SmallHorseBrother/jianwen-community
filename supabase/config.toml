[functions.ai-group-payment]
# WeChat Pay and Alipay callbacks do not carry a Supabase JWT. The function
# validates provider signatures itself; browser actions additionally validate
# the user's Supabase JWT in application code.
verify_jwt = false

[functions.ai-assessment-engine]
# Public shared-result reads do not carry a JWT. Every write/status action
# validates the Supabase user (including anonymous users) inside the function.
verify_jwt = false

[functions.ai-learning-engine]
# Anonymous users may preview recommendations; writes additionally require a
# permanent account and are validated inside the function.
verify_jwt = false

[functions.ai-specialty-exam-engine]
# A-F practice sessions support anonymous visitors. The function validates the
# supplied user JWT and keeps hidden scoring payloads server-side.
verify_jwt = false

[functions.password-reset]
# Visitors are not signed in while recovering an account. The function validates
# a one-time SMS code itself before it can change an Auth password.
verify_jwt = false
